<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ruminy 配色の比較</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #ddd; color: #1d2b3f; font: 14px/1.8 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
.page-head { padding: 16px 20px; background: #fff; }
.page-head h1 { margin: 0; font: 600 20px "Hiragino Mincho ProN", "Yu Mincho", serif; }
.page-head p { margin: 2px 0 0; font-size: 12px; color: #555; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; }
.cand { background: var(--paper); color: var(--ink); padding: 18px 22px 22px; }
.cand h2 { margin: 0; font: 600 17px "Hiragino Mincho ProN", "Yu Mincho", serif; }
.cand .about { margin: 0 0 10px; font-size: 12px; color: var(--pencil); }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.swatches span { display: inline-flex; align-items: center; gap: 5px; font: 11px ui-monospace, Menlo, monospace; color: var(--pencil); }
.swatches i { width: 14px; height: 14px; border: 1px solid #0003; display: inline-block; }
.ratios { font-size: 11px; color: var(--pencil); margin: -6px 0 12px; }
.ratios b { color: var(--ink); }
.ratios .ng { color: #c00; font-weight: 700; }
.head { display: flex; align-items: center; gap: 6px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
.head .face { width: 30px; height: 30px; overflow: hidden; }
.head .face img { width: 100%; height: 100%; transform: scale(1.5) translateY(4%); }
.head b { font: 600 18px "Hiragino Mincho ProN", "Yu Mincho", serif; }
.row { display: grid; grid-template-columns: 28px 1fr auto; gap: 6px; padding: 7px 0; border-bottom: 1px solid var(--rule); font-size: 13px; }
.row .no { font: 12px ui-monospace, Menlo, monospace; color: var(--pencil); }
.row .red { color: var(--red); font-weight: 700; }
.body { display: grid; grid-template-columns: 110px 1fr; gap: 14px; margin-top: 14px; align-items: start; }
.body img { width: 110px; }
.sheet h3 { margin: 0 0 4px; font: 600 15px "Hiragino Mincho ProN", "Yu Mincho", serif; }
.sheet p { margin: 0 0 6px; }
.sheet blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--ink); font: 600 13px "Hiragino Mincho ProN", "Yu Mincho", serif; }
.sheet small { color: var(--pencil); }
.btn { display: inline-block; margin-top: 6px; padding: 6px 12px; background: var(--ink); color: var(--paper); font-size: 12px; border-radius: 2px; }
.surface { background: var(--surface); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 6px 8px; margin-top: 10px; font-size: 12px; color: var(--pencil); }
</style>
</head>
<body>
<div class="page-head">
  <h1>ruminy の配色：紙の色の比較</h1>
  <p>インク（濃紺）はヤギの線と同じ #1D2B3F で固定。紙の色ごとに、鉛筆（補足の文字）と罫線を調整している。数値は背景とのコントラスト比（4.5 以上が目安）。</p>
</div>
<div class="grid" id="grid"></div>
<script>
const candidates = [
  { name: "A：白い紙", about: "今のモックの色。いちばん明るく、夜はまぶしい", paper: "#fbfbf8", surface: "#f0f1ec", pencil: "#666b73", rule: "#d8dce1" },
  { name: "B：藁半紙", about: "学校のプリントの色。少し灰色がかった黄土色で、ruminy のプリントの比喩に合う", paper: "#eee9dc", surface: "#e4ddcc", pencil: "#5f5d57", rule: "#d3cab6" },
  { name: "C：再生紙ノート", about: "わずかに灰色がかった落ち着いた紙。色味を足さずに明るさだけ抑える", paper: "#f1f0eb", surface: "#e6e5de", pencil: "#62656a", rule: "#d6d5cd" },
  { name: "D：夜向けの暗めの紙", about: "明るさをさらに落とした紙。夜のまぶしさは最も少ないが、昼は沈んで見える", paper: "#e6e2d8", surface: "#dbd6c9", pencil: "#57564f", rule: "#c8c1b0" },
];
const INK = "#1d2b3f", RED = "#b93a2b";
const lum = (hex) => {
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
};
const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
const fmt = (v) => `<b class="${v < 4.5 ? "ng" : ""}">${v.toFixed(1)}</b>`;
document.getElementById("grid").innerHTML = candidates.map((c) => `
  <section class="cand" style="--paper:${c.paper};--surface:${c.surface};--pencil:${c.pencil};--rule:${c.rule};--ink:${INK};--red:${RED}">
    <h2>${c.name}</h2>
    <p class="about">${c.about}</p>
    <div class="swatches">
      ${[["紙", c.paper], ["面", c.surface], ["インク", INK], ["鉛筆", c.pencil], ["罫線", c.rule], ["赤ペン", RED]].map(([n, v]) => `<span><i style="background:${v}"></i>${n} ${v}</span>`).join("")}
    </div>
    <p class="ratios">インク ${fmt(ratio(INK, c.paper))}　鉛筆 ${fmt(ratio(c.pencil, c.paper))}　赤ペン ${fmt(ratio(RED, c.paper))}　ボタンの文字 ${fmt(ratio(c.paper, INK))}</p>
    <div class="head"><span class="face"><img src="../../public/mascot/face.png" alt=""></span><b>ruminy</b></div>
    <div class="row"><span class="no">01</span><span>CPUとメモリの役割</span><span>メモの途中</span></div>
    <div class="row"><span class="no">02</span><span>2進数と情報量</span><span><span class="red">80</span></span></div>
    <div class="body">
      <img src="../../public/mascot/offer.png" alt="">
      <div class="sheet">
        <h3>1. CPUとメモリの関係</h3>
        <p>CPUは【 メモリ 】から命令を読み出して実行する。</p>
        <blockquote>考えてみよう：メモリを増やすと、なぜ速くなることがあるのだろう？</blockquote>
        <p>自分の考え：作業する机が広くなるようなもの</p>
        <small>保存しても、あとから続きを書けます</small><br>
        <span class="btn">ひな形を読み込む</span>
      </div>
    </div>
    <div class="surface">面（surface）の例：止めたときの案内や、入力欄の背景</div>
  </section>`).join("");
</script>
</body>
</html>
